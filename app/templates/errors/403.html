{% extends "base.html" %}
{% block title %}Access Denied (403){% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm p-4 border-danger">
            <div class="card-body">
                <i class="bi bi-shield-lock-fill text-danger display-1 mb-3"></i>
                <h2 class="card-title text-danger">403 - Forbidden</h2>
                <p class="card-text text-muted">You do not have administrative or required role permissions to access this page.</p>
                <a href="{{ url_for('index') }}" class="btn btn-primary mt-3"><i class="bi bi-house-door me-1"></i> Return to Safety</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
