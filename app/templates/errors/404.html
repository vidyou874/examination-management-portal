{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm p-4">
            <div class="card-body">
                <i class="bi bi-question-circle-fill text-warning display-1 mb-3"></i>
                <h2 class="card-title">404 - Not Found</h2>
                <p class="card-text text-muted">The requested page or resource could not be found.</p>
                <a href="{{ url_for('index') }}" class="btn btn-primary mt-3"><i class="bi bi-house-door me-1"></i> Return Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
