{% extends "base.html" %}
{% block title %}Internal Server Error (500){% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm p-4 border-danger">
            <div class="card-body">
                <i class="bi bi-exclamation-octagon-fill text-danger display-1 mb-3"></i>
                <h2 class="card-title text-danger">500 - Server Error</h2>
                <p class="card-text text-muted">An unexpected internal server error occurred while processing your request.</p>
                <a href="{{ url_for('index') }}" class="btn btn-primary mt-3"><i class="bi bi-house-door me-1"></i> Return Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
