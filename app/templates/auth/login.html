{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white text-center py-4 border-0">
                <i class="bi bi-shield-lock text-primary display-4 mb-2"></i>
                <h3 class="fw-bold mb-1">EMP Portal Login</h3>
                <p class="text-muted small">Sign in to manage or access examinations</p>
            </div>
            <div class="card-body px-4 py-3">
                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label for="username_or_email" class="form-label fw-semibold">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username_or_email" name="username_or_email" placeholder="e.g. admin or student@emp.edu" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </div>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <p class="text-muted small mb-2">Don't have an account?</p>
                    <div class="btn-group w-100" role="group">
                        <a href="{{ url_for('auth.register_student_route') }}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-mortarboard me-1"></i> Student Register
                        </a>
                        <a href="{{ url_for('auth.register_examiner_route') }}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-person-badge me-1"></i> Examiner Register
                        </a>
                    </div>
                </div>

                <div class="mt-3 p-2 bg-light rounded text-center small text-muted">
                    <i class="bi bi-info-circle me-1"></i> Default Administrator: <code>admin</code> / <code>Admin@123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
