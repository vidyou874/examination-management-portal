{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white text-center py-4 border-0">
                <i class="bi bi-mortarboard text-success display-5 mb-2"></i>
                <h3 class="fw-bold mb-1">Student Registration</h3>
                <p class="text-muted small">Create an account to book examination slots and check results</p>
            </div>
            <div class="card-body px-4 py-3">
                <form method="POST" action="{{ url_for('auth.register_student_route') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. aryan_s" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="e.g. aryan@univ.edu" required>
                        </div>

                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>

                        <div class="col-md-6">
                            <label for="student_id_number" class="form-label fw-semibold">Student ID / Roll No <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="student_id_number" name="student_id_number" placeholder="e.g. STU2026001" required>
                        </div>
                        <div class="col-md-6">
                            <label for="full_name" class="form-label fw-semibold">Full Legal Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. Aryan Sharma" required>
                        </div>

                        <div class="col-md-6">
                            <label for="department" class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="department" name="department" placeholder="e.g. Computer Science & Engg" required>
                        </div>
                        <div class="col-md-6">
                            <label for="program" class="form-label fw-semibold">Program / Degree <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="program" name="program" placeholder="e.g. B.Tech CSE (4th Sem)" required>
                        </div>

                        <div class="col-12">
                            <label for="phone" class="form-label fw-semibold">Phone Number (Optional)</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="e.g. +91 9876543210">
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success py-2 fw-semibold">
                            <i class="bi bi-person-plus me-1"></i> Register as Student
                        </button>
                    </div>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <span class="text-muted small">Already have an account? </span>
                    <a href="{{ url_for('auth.login') }}" class="small fw-semibold">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
